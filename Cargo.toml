[package]
name = "haste"
version = "0.1.0"
edition = "2021"
description = "Micro agent harness built for wafer-speed inference: minimum turns, minimum tokens, ~zero harness time."
license = "MIT"

[dependencies]
ureq = { version = "2", features = ["json"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossterm = "0.28"

[profile.release]
lto = true
codegen-units = 1
