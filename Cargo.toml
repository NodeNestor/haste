[package]
name = "haste"
version = "0.4.1"
edition = "2021"
description = "Micro agent harness built for wafer-speed inference: minimum turns, minimum tokens, ~zero harness time."
license-file = "LICENSE"
repository = "https://github.com/NodeNestor/haste"

[dependencies]
ureq = { version = "2", features = ["json"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossterm = "0.28"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1

[workspace]
members = [".", "swift"]
