# haste — everything moddable lives here. The binary never changes.
# This file is the documented REFERENCE. Your real config belongs in
# ~/.haste.toml (haste init writes a starter) — never commit personal setups.
#
# Lookup order: -c <path> · ./haste.toml · ~/.haste.toml · built-in default.
# Every key below is optional except [model] base_url + model; commented
# lines show the default.

[model]
base_url = "http://127.0.0.1:8000/v1"    # any OpenAI-compatible /chat/completions endpoint
model = "my-model"                        # model name sent in the request body
# api_key_env = "CEREBRAS_API_KEY"        # env VAR NAME holding the bearer key (never the key itself)
max_tokens = 32768                        # per-request output cap; the length guard recovers a clipped file, but not needing to is faster
temperature = 0.7                         # Qwen official: DO NOT use greedy (temp 0) — quality degradation + repetition; 0.7/top_p 0.8 is their recommendation
prefix_cache = true                       # provider has a token-prefix cache (llama.cpp/vLLM: yes; Cerebras: yes on supported models — automatic, exact-prefix, but cached tokens still bill at FULL input rate, so keep compact_phase_tokens LOW there)

[model.extra_body]                        # merged VERBATIM into every request — provider quirks live here, not in code
top_p = 0.8                               # Qwen-recommended sampling
repetition_penalty = 1.05

[model.extra_body.chat_template_kwargs]
enable_thinking = false                   # no effort — iterate, don't deliberate

[prompt]
# system = "You are haste, ..."           # replaces the built-in identity line (command reference stays generated)
# extra = "House rules: ..."              # appended after the rules — same slot mods inject into

[context]
mode = "append"          # "append" (prefix-cache friendly) | "working_set" (max compression, re-rendered every turn)
budget_tokens = 40000    # ledger render budget; over-budget triggers compaction
fold_after_turns = 6     # working_set: tool results older than this collapse to one line
max_turns = 0            # 0 = unlimited; loop breaker + empty-turn abort + Esc are the guards
result_cap_chars = 12000 # hard cap on any single tool result, applied before pruners
# bootstrap = true       # pin a workspace orientation block (os/project/git/layout) at ledger head
# compact = "model"      # over-budget: "model" (prompt-cached self-summary) | "structural" (mechanical folding)
# compact_keep_last = 10 # ledger entries kept verbatim behind a model-compaction seal
# compact_phase_tokens = 0 # phase-boundary seal floor: completed plan step + doc over this -> compact now (0 = budget/3)
# instruction_files = ["HASTE.md", "AGENTS.md", "CLAUDE.md"]  # project instructions pinned into bootstrap when present

[exec]
# shell = "powershell"   # what X runs: "powershell" | "cmd" | "sh" (default: powershell on Windows, sh elsewhere)

[verify]
# cmd = "cargo test"     # runs automatically after every editing turn; failing verify refuses a same-turn D
# claims = false         # one prompt-cached call at D: does the final report match what the run ACTUALLY did?
                         # (harness supplies the facts - files written, commands run, errors - the model only
                         #  matches claims against them). Catches "written to out/x.json" when nothing was written.
# timeout_ms = 180000
# prune = "first_failure"

[plan]
# file = ".haste/plan.json"  # the live plan state machine the model edits (inside .haste/ so it never pollutes the project tree)
# enforce = true         # refuse D while steps are open; auto-verify steps marked done

[distill]
max_tokens = 400
# prompt = "Extract only the facts relevant to the task below. Terse bullet lines, no prose. TASK: {task}\n---\n{text}"

# mods_dir = "~/.haste/mods"  # each subdir with a mod.toml adds verbs/prompt/env — see examples/mods/

# ---- config-declared tools: one uppercase verb (outside REIGNXADVSOP) each ----
# prune chain: head_tail:A,B | first_failure | errors_only | drop:REGEX | keep:REGEX | distill | none

[tool.T]
desc = "run tests (first failure only)"
cmd = "cargo test {args}"
prune = "first_failure"
timeout_ms = 180000

[tool.C]
desc = "typecheck"
cmd = "cargo check --message-format short {args}"
prune = "errors_only|head_tail:30,5"

[tool.W]
desc = "fetch a URL (distilled to task-relevant facts)"
cmd = "curl -sL --max-time 20 {args}"
prune = "drop:^\\s*<|distill"

[tool.K]
desc = "screenshot the screen to shot.png (then V shot.png to see it)"
cmd = "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; $b=[System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp=New-Object System.Drawing.Bitmap($b.Width,$b.Height); $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.X,$b.Y,0,0,$bmp.Size); $bmp.Save('shot.png'); 'shot.png saved'"
timeout_ms = 20000

# ---- subagent profiles: spawned with `A <profile> <task>`, run in parallel ----

[profile.researcher]
system = "You research. Gather facts fast, never edit files. Your D message is a terse brief of findings."
tools = "RGXWVP"         # verb letters this profile may use
max_turns = 0            # 0 = unlimited
budget_tokens = 8000

[profile.fixer]
system = "You fix exactly the issue in the task. Verify with C/T before D."
tools = "REIGNXTCV"
max_turns = 0
budget_tokens = 10000

