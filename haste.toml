# haste — everything moddable lives here. The binary never changes.

[model]
base_url = "http://127.0.0.1:18081/v1"   # Qwen3.8-27B-FP8 on vLLM
model = "q38"
# api_key_env = "CEREBRAS_API_KEY"
max_tokens = 8192                         # big files must fit in one payload; cuts trigger rewrite loops
temperature = 0.7                         # temp 0 makes Qwen FP8 degenerate into !!!! spam
prefix_cache = true                       # llama.cpp/vLLM: true, Cerebras: false

[model.extra_body]
top_p = 0.8                               # Qwen-recommended sampling
repetition_penalty = 1.05

[model.extra_body.chat_template_kwargs]
enable_thinking = false                   # no reasoning — iterate, don't deliberate

[context]
mode = "append"          # "append" (prefix-cache friendly) | "working_set" (max compression)
budget_tokens = 16000
fold_after_turns = 6     # working_set: tool results older than this collapse to one line
max_turns = 0            # 0 = unlimited; loop breaker + empty-turn abort + Esc are the guards
result_cap_chars = 12000

# ---- config-declared tools: one uppercase verb (outside REIGNXAD) each ----

[tool.T]
desc = "run tests (first failure only)"
cmd = "cargo test {args}"
prune = "first_failure"
timeout_ms = 180000

[tool.C]
desc = "typecheck"
cmd = "cargo check --message-format short {args}"
prune = "errors_only|head_tail:30,5"

[tool.W]
desc = "fetch a URL (distilled to task-relevant facts)"
cmd = "curl -sL --max-time 20 {args}"
prune = "drop:^\\s*<|distill"

[tool.P]
desc = "screenshot the screen to shot.png (then V shot.png to see it)"
cmd = "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; $b=[System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp=New-Object System.Drawing.Bitmap($b.Width,$b.Height); $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.X,$b.Y,0,0,$bmp.Size); $bmp.Save('shot.png'); 'shot.png saved'"
timeout_ms = 20000

# ---- subagent profiles ----

[profile.researcher]
system = "You research. Gather facts fast, never edit files. Your D message is a terse brief of findings."
tools = "RGXWVP"
max_turns = 0
budget_tokens = 8000

[profile.fixer]
system = "You fix exactly the issue in the task. Verify with C/T before D."
tools = "REIGNXTCV"
max_turns = 0
budget_tokens = 10000

[distill]
max_tokens = 400
# prompt = "Extract only the facts relevant to the task below. Terse bullet lines, no prose. TASK: {task}\n---\n{text}"
